<!-- stdDeviation turned DOWN from the literal Figma export (13.1997) to 5.
     At the literal value this white glow is invisible — not just here,
     but in Figma's own composited render too (verified against node
     693:6908, the Step_7 "Highlight the Inner Corner" frame): a shape
     this small (~48x27 units) blurred that heavily spreads its white fill
     so thin that its peak alpha reads as no contrast at all against this
     illustration's light skin-tone background at this spot. Confirmed via
     a live-DOM patch test that the shape's *position* is correct (it
     lands on skin beside the eye corner, not on the white sclera) — the
     invisibility is purely blur-vs-size, not placement. Reduced blur only
     (no color/opacity change) is the deliberate fix. Tested visible range
     is ~0.5 (crisp, hard-edged) to just under 6 — it fades back to
     imperceptible by 8, so don't go above ~6. Its twin in
     ../Step_7/add-highlight.svg shares this exact shape and must be kept
     in sync if this value ever changes. -->

<svg preserveAspectRatio="none" overflow="visible" style="display: block;" width="100.234" height="81.6989" viewBox="0 0 100.234 81.6989" fill="none" xmlns="http://www.w3.org/2000/svg">
